<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shillim Institute</title>
    <link rel="stylesheet" href="shilim.css">

    <!-- Start streaming the decorative landing image immediately, in parallel
         with the (parser-blocking-free) libraries and fonts below, so it is
         already in the browser cache by the time PixiJS asks for it. We pick
         the image here and expose the choice so Resources.js loads the same
         one (no wasted requests). -->
    <script>
        (function () {
            var candidates = [0, 1, 2, 3, 4];
            var pick = candidates[Math.floor(Math.random() * candidates.length)];
            var base = 'assets/PREVIEW-ASSETS/previewimages/';
            var thumb = base + 'thumbs/' + pick + '.webp';
            var full = base + pick + '.png';
            // Load the small WebP; keep the full image as a fallback.
            window.__PREVIEW_SRC = thumb;
            window.__PREVIEW_SRC_FULL = full;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = thumb;
            link.setAttribute('fetchpriority', 'high');
            document.head.appendChild(link);
        })();
    </script>

    <!-- defer keeps these from blocking the parser; they still execute in
         order before the deferred module script that depends on them. -->
    <script src="jszip.min.js" defer></script>
    <script src="gsap.min.js" defer></script>
    <script src="pixi.min.js" defer></script>
</head>
<body class="page-index">
    <!-- Mobile redirect overlay -->
    <div class="mobile-redirect">
        <canvas class="mobile-redirect__canvas"></canvas>
        <div class="mobile-redirect__content">
            <h1>The Shillim Archive</h1>
            <p>This interactive archive experience is designed for larger screens (Desktops and Tablets). But you can explore the full project index on your device instead.</p>
            <a href="projectindex.html">Browse the Archive</a>
        </div>
    </div>
    <script src="MobileCreatures.js" defer></script>

    <div id="app-container"></div>

    <script type="module">
        import { initApp } from './App.js';
        import { LoadTextures } from './Resources.js';

        // Ensure the self-hosted fonts are fully loaded before PixiJS rasterises
        // any text, otherwise glyphs bake with a fallback face and won't refresh.
        async function loadFonts() {
            if (!document || !document.fonts) return;
            const faces = [
                '300 1em "Hind Madurai"', '400 1em "Hind Madurai"', '500 1em "Hind Madurai"',
                '600 1em "Hind Madurai"', '700 1em "Hind Madurai"',
                '400 1em "Gelasio"', 'italic 400 1em "Gelasio"',
                '700 1em "Gelasio"', 'italic 700 1em "Gelasio"',
                '400 1em "IBM Plex Mono"'
            ];
            try { await Promise.all(faces.map((f) => document.fonts.load(f))); } catch (e) { /* noop */ }
            try { await document.fonts.ready; } catch (e) { /* noop */ }
        }

        // Wait for app to be ready
        async function init() {
            await initApp();
            await loadFonts();
            await LoadTextures();
        }

        init().catch(console.error);
    </script>
</body>
</html>
